name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys (don't cancel one mid-restart) so two runs never race the VPS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Decide which app images actually need rebuilding from the diff. Shared deps fan
  # out: a lockfile / packages/types / compose / workflow change rebuilds everything;
  # packages/ui rebuilds web+admin. An api-only change builds just api.
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set
        run: |
          set -euo pipefail
          ALL='["api","web","admin"]'
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"; echo "$FILES"
          # Anything shared rebuilds all three.
          if echo "$FILES" | grep -qE '^(\.github/workflows/|docker-compose|pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|packages/types/)'; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          apps=()
          echo "$FILES" | grep -qE '^apps/api/'              && apps+=("api")   || true
          echo "$FILES" | grep -qE '^(apps/web/|packages/ui/)'   && apps+=("web")   || true
          echo "$FILES" | grep -qE '^(apps/admin/|packages/ui/)' && apps+=("admin") || true
          if [ ${#apps[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${apps[@]}" | sort -u | jq -R . | jq -cs . \
              | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          fi

  # Quality gate — typecheck + lint must pass before we spend a runner building
  # images or touch the VPS. Reuses .github/workflows/ci.yml via workflow_call so
  # the PR check and the deploy gate are literally the same job.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  # Build only the changed images, in parallel, on a 4-vCPU/16GB runner with a
  # persistent layer cache, and push to GHCR. The 2GB VPS never builds anything.
  build:
    name: Build & push ${{ matrix.app }}
    needs: [changes, verify]
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/kamronbek/talim-${{ matrix.app }}:latest
            ghcr.io/kamronbek/talim-${{ matrix.app }}:${{ github.sha }}
          # Inlined into the web/admin client bundle at build (public URL, mirrors
          # Doppler prd NEXT_PUBLIC_API_URL). The api Dockerfile ignores it.
          build-args: |
            NEXT_PUBLIC_API_URL=https://talim-ai.uz/api
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # The VPS logs into GHCR, pulls :latest for the app tier, and restarts only the
  # containers whose image changed. No building.
  deploy:
    name: Deploy to VPS
    needs: [changes, build]
    if: needs.changes.outputs.matrix != '[]' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # 30m (was 15m): the 2GB VPS pulling all three fresh Next.js images at once can
    # exceed 15m and get cancelled mid-restart. Combined with the sequential pull below.
    timeout-minutes: 30
    steps:
      - name: Pull images & restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 25m
          envs: DOPPLER_TOKEN,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.registry.yml"
            REPO_DIR="${HOME}/talim-ai"
            REPO_URL="https://github.com/KAMRONBEK/talim-ai.git"

            command -v doppler >/dev/null 2>&1 || \
              curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh \
                | sh -s -- --install-path /usr/local/bin

            [ -d "${REPO_DIR}/.git" ] || git clone "${REPO_URL}" "${REPO_DIR}"
            cd "${REPO_DIR}"
            git fetch origin main
            git reset --hard origin/main

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export DOPPLER_TOKEN
            DOPPLER_RUN="doppler run --project talim-ai --config prd --"

            # Reclaim ONLY dangling layers before pulling — NOT `-af`. Disk is not the
            # tight resource on this box (RAM is); an aggressive `-af` evicts the shared
            # ~193MB node:alpine base the moment the old app images are superseded, forcing
            # EVERY deploy to re-download + decompress it (~193MB → real RAM pressure on the
            # 1.9GB box). Dangling-only keeps that base cached, so a routine deploy pulls
            # just the changed app layers. Superseded images are reclaimed by the
            # post-deploy `prune -af` below (only after the new stack is healthy). The OLD
            # stack is still running here, so its in-use layers are protected regardless.
            # `|| true` so a cleanup hiccup never aborts the deploy.
            echo "disk before cleanup:"; df -h / | tail -1
            docker container prune -f || true
            docker image prune -f || true
            echo "disk after cleanup:"; df -h / | tail -1

            # Pull :latest for the app tier ONLY (api/web/admin from GHCR). db/redis/nginx
            # are pinned public images already on the host — pulling them from Docker Hub
            # every deploy intermittently fails on TLS timeouts and aborts the whole deploy.
            # Pull SEQUENTIALLY (one image at a time): the 2GB VPS decompressing three large
            # Next.js images in parallel pushes it into swap and a deploy can blow past the
            # job timeout. Each image gets its own retry so a single transient GHCR
            # TLS-handshake timeout doesn't abort an otherwise-healthy deploy.
            for img in api web admin; do
              pulled=0
              for attempt in 1 2 3; do
                if ${DOPPLER_RUN} docker compose ${COMPOSE_FILES} pull "${img}"; then pulled=1; break; fi
                echo "pull ${img} attempt ${attempt} failed (transient registry error); retrying in 10s..."
                sleep 10
              done
              [ "${pulled}" = 1 ] || { echo "image pull for ${img} failed after 3 attempts"; exit 1; }
            done
            # up recreates only containers whose image digest changed.
            ${DOPPLER_RUN} docker compose ${COMPOSE_FILES} up -d --no-build --wait db redis api web admin
            ${DOPPLER_RUN} docker compose ${COMPOSE_FILES} up -d --no-build --force-recreate --no-deps --wait nginx

            docker logout ghcr.io || true
            # Free the images the new stack just superseded (now unused; running
            # containers protect their own images). -af, not dangling-only, and never
            # fail the deploy on a prune hiccup.
            docker image prune -af || true

  # Post-deploy verification against the REAL production origins.
  #
  # `compose up --wait` above proves the containers started. It proves nothing about
  # whether the application works, and this is the one class of defect no local run
  # can ever see: prod-only config. A wrong CORS_ORIGIN took production login down on
  # 2026-07-18 and nothing noticed — the containers were healthy the whole time. Every
  # check below is therefore aimed at prod config, not at code.
  #
  # Fails loudly and leaves the evidence in the log. It deliberately does NOT roll
  # back: an automatic rollback would erase the broken state this job exists to show.
  smoke:
    name: Post-deploy smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WEB_ORIGIN: https://talim-ai.uz
      ADMIN_ORIGIN: https://admin.talim-ai.uz
      # nginx rewrites /api/* onto the API, which mounts its routes at the root —
      # so /api/health here is the API's GET /health.
      API_BASE: https://talim-ai.uz/api
    steps:
      # Gate: give the freshly recreated containers a bounded window to answer before
      # judging anything. Without this, a slow cold start on the 2GB VPS would look
      # identical to a broken deploy.
      - name: Wait for the API to answer
        run: |
          set -uo pipefail
          for attempt in $(seq 1 20); do
            code=$(curl -sS --max-time 15 -o /tmp/health.body -w '%{http_code}' "$API_BASE/health" 2>/tmp/health.err)
            code=${code:-000}
            if [ "$code" = "200" ]; then
              echo "api answered 200 after ${attempt} attempt(s): $(tr -d '\n' < /tmp/health.body)"
              exit 0
            fi
            echo "attempt ${attempt}/20: GET ${API_BASE}/health -> ${code}"
            # Tight retries first (normal restart), then long ones (image cold start).
            sleep $(( attempt < 6 ? 5 : 15 ))
          done
          echo "::error title=Production API never came back::GET ${API_BASE}/health did not return 200 within ~4 minutes of the deploy finishing."
          echo "--- last curl stderr ---"; tr -d '\r' < /tmp/health.err || true
          echo "--- last body ---"; head -c 500 /tmp/health.body || true; echo
          echo "--- verbose retry ---"; curl -sS -i --max-time 20 "$API_BASE/health" || true
          exit 1

      - name: Smoke the deployed application
        env:
          # Any real production account. Used only to prove the login path still
          # returns a token. Unset today, so the login check self-skips — every other
          # check below runs without it. (The HEALTH_ADMIN_* fallback that used to sit
          # here pointed at the scheduled health monitor, which has been removed.)
          CANARY_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          CANARY_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
        run: |
          # No `set -e`: every check runs so one failure does not hide the others,
          # and the job fails once at the end with the full picture.
          set -uo pipefail
          TMP=$(mktemp -d)
          FAILURES=0

          summary() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          pass() { echo "PASS  $1 — $2"; summary "| ✅ | $1 | $2 |"; }
          fail() {
            FAILURES=$((FAILURES + 1))
            echo "FAIL  $1 — $2"
            echo "::error title=Smoke failed: $1::$2"
            summary "| ❌ | $1 | $2 |"
          }
          dump() {
            echo "--- $1 response headers ---"; tr -d '\r' < "$1.head" 2>/dev/null || true
            echo "--- $1 body (first 800 bytes) ---"; head -c 800 "$1.body" 2>/dev/null || true; echo
          }

          # Retry only on 000 (DNS/TLS/connect failure) and 5xx — a container still
          # warming up. A 4xx is a considered answer from the app; retrying it just
          # burns the budget and delays the report.
          #
          # FETCH_BODY carries a request body on stdin instead of from a file, and is
          # re-fed on every attempt — piping a body into this function instead would
          # leave attempts 2..4 POSTing nothing and reporting a bogus failure.
          FETCH_BODY=''
          fetch() {
            local out=$1; shift
            local code attempt
            for attempt in 1 2 3 4; do
              if [ -n "$FETCH_BODY" ]; then
                code=$(printf '%s' "$FETCH_BODY" \
                  | curl -sS --max-time 25 -o "${out}.body" -D "${out}.head" \
                    -w '%{http_code}' "$@" --data @- 2>"${out}.err")
              else
                code=$(curl -sS --max-time 25 -o "${out}.body" -D "${out}.head" \
                  -w '%{http_code}' "$@" 2>"${out}.err")
              fi
              code=${code:-000}
              case "$code" in
                000|5??)
                  if [ "$attempt" -lt 4 ]; then sleep $(( attempt * 5 )); fi
                  ;;
                *) break ;;
              esac
            done
            printf '%s' "$code"
          }

          summary "## Post-deploy smoke — \`${GITHUB_SHA:0:7}\`"
          summary ""
          summary "| | check | result |"
          summary "|---|---|---|"

          # ---- 1. API health -------------------------------------------------
          code=$(fetch "$TMP/api" "$API_BASE/health")
          if [ "$code" != "200" ]; then
            fail "api /api/health" "HTTP $code"; dump "$TMP/api"
          elif ! grep -q '"status"' "$TMP/api.body"; then
            fail "api /api/health" "200 but the body is not the health JSON"; dump "$TMP/api"
          else
            pass "api /api/health" "200 · $(head -c 80 "$TMP/api.body")"
          fi

          # ---- 2. Web landing renders ---------------------------------------
          # Both /uz and the admin login defer their real markup to the client (they
          # return a "Loading..." shell until `mounted`), so grepping for headline copy
          # would fail against a perfectly healthy prod. The server-side proof that the
          # app actually rendered is the RSC payload (`__next_f`) plus the localized
          # <html lang>: an nginx 502, a crashed container, or a Next error page has
          # neither.
          # -L only on the page fetches: a locale/trailing-slash redirect is normal here.
          # The preflight and login calls below deliberately do NOT follow redirects —
          # a 3xx there is itself the bug and following it would hide it.
          code=$(fetch "$TMP/web" -L --max-redirs 3 "$WEB_ORIGIN/uz")
          size=$(( $(wc -c < "$TMP/web.body" 2>/dev/null || echo 0) ))
          if [ "$code" != "200" ]; then
            fail "web /uz" "HTTP $code"; dump "$TMP/web"
          elif ! grep -q 'lang="uz"' "$TMP/web.body"; then
            fail "web /uz" "200 but no lang=\"uz\" on <html> — the locale shell did not render"; dump "$TMP/web"
          elif ! grep -q '__next_f' "$TMP/web.body"; then
            fail "web /uz" "200 but no React tree in the HTML — an error page, not the app"; dump "$TMP/web"
          elif [ "$size" -lt 2000 ]; then
            fail "web /uz" "200 but only ${size} bytes — the page is a stub"; dump "$TMP/web"
          else
            pass "web /uz" "200 · ${size} bytes · localized React tree rendered"
          fi
          # Advisory only: the hero copy travels in the streamed payload, so its absence
          # usually just means the copy changed. Never fails the deploy.
          if [ "$code" = "200" ] && ! grep -q 'yakunlaydigan' "$TMP/web.body"; then
            echo "::warning title=Landing copy marker missing::the uz hero string was not in the HTML for /uz — copy changed, or the page stopped streaming its messages."
          fi

          # ---- 3. Admin login page loads ------------------------------------
          # Same client-gated shape as /uz: apps/admin/app/login/page.tsx is 'use client'
          # and returns a "Loading…" shell until `mounted`, so none of its own copy is in
          # the server HTML. What IS server-rendered is apps/admin/app/layout.tsx —
          # its `metadata.title` becomes <title>Talim Admin</title> in the <head>.
          #
          # Both markers are needed. `_next/static` alone only proves *some* Next app
          # answered: nginx's admin server block proxies to `admin:3001` via a variable,
          # and if that ever pointed at web:3000 the web app would serve /login (next-intl
          # redirects it to /uz/login, which -L follows) with a perfectly good Next bundle
          # and a 200 — the admin panel entirely gone, and this check green.
          code=$(fetch "$TMP/admin" -L --max-redirs 3 "$ADMIN_ORIGIN/login")
          if [ "$code" != "200" ]; then
            fail "admin /login" "HTTP $code"; dump "$TMP/admin"
          elif ! grep -q '_next/static' "$TMP/admin.body"; then
            fail "admin /login" "200 but no Next client bundle — the admin container is not serving the app"; dump "$TMP/admin"
          elif ! grep -q 'Talim Admin' "$TMP/admin.body"; then
            fail "admin /login" "200 and a Next bundle, but no 'Talim Admin' <title> — $ADMIN_ORIGIN is serving a DIFFERENT app (check the admin upstream in nginx.conf). If the admin app was legitimately retitled, update this marker."; dump "$TMP/admin"
          else
            pass "admin /login" "200 · admin app served on $ADMIN_ORIGIN"
          fi

          # ---- 4. CORS preflight from the real browser origins ---------------
          # The admin panel lives on its own subdomain but calls the API on the primary
          # one, so EVERY admin request is cross-origin and a wrong CORS_ORIGIN takes
          # the whole panel down while every container stays green (2026-07-18).
          #
          # The whole chain is asserted, not assumed: nginx.conf does no CORS of its own,
          # its `location /api/` does `rewrite ^/api/(.*) /$1` — so this OPTIONS lands on
          # the API's `/auth/login`, which mounts at the root. apps/api/src/index.ts
          # answers it from the `cors()` middleware before any route (so loginRateLimit,
          # which is attached to the POST only, can never turn this into a 429), reflects
          # the request Origin when it is in the allow-list, and ends the preflight with
          # the cors package's default 204. A rejected origin instead falls through to
          # errorMiddleware with no Allow-Origin header at all — which is what the two
          # branches below distinguish.
          #
          # The web origin is checked even though the web app is same-origin with /api
          # and never triggers a browser preflight: browsers still send `Origin` on
          # same-origin POSTs, so dropping it from CORS_ORIGIN would 500 every login.
          preflight() {
            local label=$1 origin=$2 out="$TMP/cors-$1"
            local code allow creds
            code=$(fetch "$out" -X OPTIONS "$API_BASE/auth/login" \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization')
            allow=$(tr -d '\r' < "${out}.head" | awk 'tolower($1)=="access-control-allow-origin:"{print $2}' | tail -1)
            creds=$(tr -d '\r' < "${out}.head" | awk 'tolower($1)=="access-control-allow-credentials:"{print $2}' | tail -1)
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              fail "cors preflight ($label)" "OPTIONS /auth/login -> HTTP $code from origin $origin"; dump "$out"
            elif [ "$allow" != "$origin" ]; then
              fail "cors preflight ($label)" "Access-Control-Allow-Origin was '${allow:-<absent>}', expected '$origin' — CORS_ORIGIN in Doppler prd is wrong, the browser will block every call from $origin"; dump "$out"
            elif [ "$creds" != "true" ]; then
              fail "cors preflight ($label)" "Access-Control-Allow-Credentials was '${creds:-<absent>}', expected 'true'"; dump "$out"
            else
              pass "cors preflight ($label)" "$code · allow-origin $allow · credentials true"
            fi
          }
          preflight admin "$ADMIN_ORIGIN"
          preflight web "$WEB_ORIGIN"

          # ---- 5. Canary login ----------------------------------------------
          if [ -z "${CANARY_EMAIL:-}" ] || [ -z "${CANARY_PASSWORD:-}" ]; then
            echo "::warning title=Canary login skipped::add the SMOKE_LOGIN_EMAIL / SMOKE_LOGIN_PASSWORD repo secrets to arm the login canary."
            summary "| ⚠️ | canary login | skipped — no SMOKE_LOGIN_* secret set |"
          else
            # The credential never touches the disk and never appears in any argv: jq
            # reads it from the environment (--arg would have put it on jq's own command
            # line) and curl reads the body from stdin. This used to write login.json and
            # delete it four lines later, which left a plaintext production password on
            # the runner for the rest of its life if the job was cancelled in between.
            FETCH_BODY=$(jq -nc '{email: $ENV.CANARY_EMAIL, password: $ENV.CANARY_PASSWORD}')
            code=$(fetch "$TMP/login" -X POST "$API_BASE/auth/login" \
              -H 'Content-Type: application/json')
            FETCH_BODY=''
            token=$(jq -r '.token // empty' "$TMP/login.body" 2>/dev/null || true)
            # Public repo, public logs, and a runtime-minted JWT is not covered by
            # repo-secret masking — register it so an accidental echo is redacted.
            if [ -n "$token" ]; then echo "::add-mask::$token"; fi
            if [ "$code" != "200" ] || [ -z "$token" ]; then
              # Never dump this body: on success it carries a real 7-day JWT.
              msg=$(jq -r '.message // "(no message)"' "$TMP/login.body" 2>/dev/null | head -c 200)
              fail "canary login" "HTTP $code, token $([ -n "$token" ] && echo present || echo missing) · api said: $msg"
            else
              pass "canary login" "200 · token returned (${#token} chars)"
            fi
          fi

          summary ""
          if [ "$FAILURES" -gt 0 ]; then
            summary "**${FAILURES} check(s) failed.** The deploy was NOT rolled back — production is live in this state."
            echo "${FAILURES} smoke check(s) failed"
            exit 1
          fi
          summary "All checks passed against production."
